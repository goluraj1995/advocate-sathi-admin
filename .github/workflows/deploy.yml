
name: Deploy Advocate Sathi Admin Panel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Fixed PDF Import ZIP
        run: |
          set -e
          ZIP_FILE="Advocate-Sathi-Admin-Panel-GitHub-Pages-PDF-Import-FIXED.zip"
          test -f "$ZIP_FILE"
          mkdir -p site
          unzip -o "$ZIP_FILE" -d site
          echo "Extracted website files:"
          find site -maxdepth 3 -type f | sort
          test -s site/index.html
          test -s site/lib/pdf.min.js
          test -s site/lib/pdf.worker.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
