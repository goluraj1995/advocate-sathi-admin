
name: Deploy Advocate Sathi Admin Panel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract v10 ZIP
        run: |
          set -e
          ZIP="Advocate-Sathi-Admin-Panel-GitHub-Pages-PDF-Import-PARSER-FIX-v10.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::v10 ZIP repository root mein nahi mili."
            ls -la
            exit 1
          fi

          mkdir -p site
          unzip -oq "$ZIP" -d site

          if [ -d site/public ] && [ -f site/public/index.html ] && [ ! -f site/index.html ]; then
            cp -a site/public/. site/
          fi

          test -f site/index.html
          test -f site/lib/pdf.min.js
          test -f site/lib/pdf.worker.min.js
          test -f site/js/pdf-parser.js

          echo "v10 ZIP files verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
