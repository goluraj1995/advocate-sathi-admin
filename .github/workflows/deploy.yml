
name: Deploy Advocate Sathi Admin Panel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Advocate-Sathi-Admin-Panel-GitHub-Pages-PDF-Import-PARSER-FIX-v3.zip"

          if [ ! -s "$ZIP_FILE" ]; then
            echo "::error::v3 ZIP not found or empty: $ZIP_FILE"
            echo "ZIP files in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "v3 ZIP found:"
          ls -lh "$ZIP_FILE"

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

      - name: Extract v3 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Advocate-Sathi-Admin-Panel-GitHub-Pages-PDF-Import-PARSER-FIX-v3.zip"

          mkdir -p site
          unzip -o "$ZIP_FILE" -d site

          echo "Checking required files..."

          for FILE in \
            site/index.html \
            site/lib/pdf.min.js \
            site/lib/pdf.worker.min.js
          do
            if [ ! -s "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              echo "Files extracted from ZIP:"
              find site -maxdepth 4 -type f -print
              exit 1
            fi
          done

          echo "All required files found."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
